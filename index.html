<!DOCTYPE html>
<html type="text/html" lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- CSS
      ––––––––––––––––––––––––––––––––––––––––––––––––––-->
    <link rel="stylesheet" href="assets/css/skeleton.css" type="text/css" />
    <!-- Favicon

    <link
      rel="shortcut icon"
      href="assets/img/favicon.ico"

  <body>
    <noscript>
      <div class="container" style="text-align: center">
        <h3>JavaScript is disabled</h3>
        <p>
          To enjoy the full functionality of this site, please enable JavaScript
          in your browser.
        </p>
        <a
          class="button button-primary"
          target="_blank"
          href="https://www.enable-javascript.com/"
          aria-label="Enable JavaScript in your browser"
          >Enable JavaScript</a
        >
        <span style="margin: 0 10px">or</span>
        <a
          class="button"
          target="_blank"
          href="https://browser-update.org/en/update-browser.html"
          aria-label="Update your browser"
          >Update your browser</a
        >
      </div>
    </noscript>

    <nav class="navbar nav-show" id="navbar">
      <div class="container">
        <ul>
          <li>
            <a href="#">
              <img class="logo" src="assets/img/brand-icon.svg" alt="" />
            </a>
          </li>
          <li>
            <a href="javascript:void(0)" id="telegraphModalTrigger"
              >Virtual Telegraph</a
            >
          </li>
          <li><a href="javascript:void(0)">Morse Dictionary</a></li>
          <li><a href="javascript:void(0)">FAQ</a></li>
          <li><a href="javascript:void(0)" id="openModalLink">Themes</a></li>
          <li class="icon">
            <a href="javascript:void(0);" onclick="toggleMobileNav()">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="currentColor"
                class="bi bi-list"
                viewBox="0 0 16 16"
              >
                <path
                  fill-rule="evenodd"
                  d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"
                /></svg
            ></a>
          </li>
        </ul>
      </div>
    </nav>

    <main>
      <div class="container">
        <div class="converter">
          <h1>Morse Code Converter</h1>
          <textarea
            id="inputTextArea"
            placeholder="Enter the text or Morse code here..."
            autofocus
            class="converter-input"
            required
          ></textarea>
          <div class="button-container">
            <button
              title="Convert input to Morse code"
              class="button-primary morse-btn"
              onclick="encodeTextToMorse()"
            >
              Convert to Morse
            </button>
            <button
              title="Convert Morse input to text"
              class="button text-btn"
              onclick="encodeMorseToText()"
            >
              Convert to Text
            </button>
          </div>
          <h2 class="result-label">Your result:</h2>
          <p class="result-text" id="resultText">
            You haven't converted anything yet ┑(￣Д ￣)┍
          </p>
          <button
            class="button"
            title="Copy result to clipboard"
            id="copyButton"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-copy"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1z"
              /></svg
            >&nbsp;&nbsp; Copy result
          </button>
        </div>
      </div>
    </main>

    <div id="modal" class="modal">
      <div class="modal-content">
        <span id="closeModalButton" title="Cerrar" class="close"
          ><i class="bi bi-x-circle"></i
        ></span>
        <h3>Establecer tema del codificador</h3>
        <p>
          Escoge un tema de tu gusto para personalizar el aspecto de Crucial
          Codificator.
        </p>

        <div class="btn-container">
          <button
            class="btn-theme"
            data-theme="light-coral"
            title="Coral Claro"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-circle-fill"
              style="color: var(--light-coral)"
              viewBox="0 0 16 16"
            >
              <circle cx="8" cy="8" r="8" />
            </svg>
            Coral Claro
          </button>
          <button
            class="btn-theme"
            data-theme="majorelle-blue"
            title="Azul Majorelle"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-circle-fill"
              style="color: var(--majorelle-blue)"
              viewBox="0 0 16 16"
            >
              <circle cx="8" cy="8" r="8" />
            </svg>
            Azul Majorelle
          </button>
          <button class="btn-theme" data-theme="ut-orange" title="Naranja UT">
            <span style="color: var(--ut-orange)"
              ><i class="bi bi-circle-fill"></i
            ></span>
            Naranja UT
          </button>
          <button
            class="btn-theme"
            data-theme="mikado-yellow"
            title="Amarillo Mikado"
          >
            <span style="color: var(--mikado-yellow)"
              ><i class="bi bi-circle-fill"></i
            ></span>
            Amarillo Mikado
          </button>
          <button
            class="btn-theme"
            data-theme="viridian"
            title="Verde Viridiana"
          >
            <span style="color: var(--viridian)"
              ><i class="bi bi-circle-fill"></i
            ></span>
            Verde Viridiana
          </button>
          <button class="btn-theme" data-theme="amethyst" title="Amatista">
            <span style="color: var(--amethyst)"
              ><i class="bi bi-circle-fill"></i
            ></span>
            Amatista
          </button>
          <button
            class="btn-theme"
            data-theme="walnut-brown"
            title="Marrón Nuez"
          >
            <span style="color: var(--walnut-brown)"
              ><i class="bi bi-circle-fill"></i
            ></span>
            Marrón Nuez
          </button>
          <button class="btn-theme" data-theme="charcoal" title="Gris Carbón">
            <span style="color: var(--charcoal)"
              ><i class="bi bi-circle-fill"></i
            ></span>
            Gris Carbón
          </button>
        </div>
        Tema actual:<i class="bi bi-circle-fill"></i>
        <span id="currentThemeName"></span>
      </div>
    </div>
    <div id="overlay" class="overlay"></div>

    <audio
      type="audio/mp3"
      id="soundDot"
      src="assets/snds/soundDot.mp3"
    ></audio>
    <audio
      type="audio/mp3"
      id="soundDash"
      src="assets/snds/soundDash.mp3"
    ></audio>
    <script type="text/javascript" src="assets/js/navbar.js"></script>
    <script type="text/javascript" src="assets/js/modals.js"></script>
    <script type="text/javascript" src="assets/js/morse_decoder.js"></script>
    <script type="text/javascript" src="assets/js/theme_handler.js"></script>
    <script
      type="text/javascript"
      src="assets/js/virtual_telegraph.js"
    ></script>
  </body>
</html>
